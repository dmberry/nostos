<!doctype html>
<meta charset="utf-8">
<title>Draughts panel + release notice</title>
<style>
  body { margin:0; background:#171a1f; color:#d7dbe2;
         font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .wrap { padding:24px 28px 34px; }
  h1 { font:600 14px/1.2 inherit; letter-spacing:.14em; text-transform:uppercase; margin:0 0 16px; }
  canvas { display:block; border:1px solid #000; margin-bottom:8px; }
  p.cap { color:#9aa3b1; margin:0 0 24px; max-width:640px; }
  b { color:#f2c65e; font-weight:600; }
</style>
<div class="wrap">
  <h1>Draughts window &amp; release notice</h1>
  <div id="out"></div>
</div>
<script type="module">
import { uiMethods } from '../../src/engine/ui.js';
import { newCabinet } from '../../src/game/draughts-cabinet.js';

function shot(caption, w, h, fn) {
  const host = document.getElementById('out');
  const cv = document.createElement('canvas');
  cv.width = w * devicePixelRatio; cv.height = h * devicePixelRatio;
  cv.style.width = w+'px'; cv.style.height = h+'px';
  const ctx = cv.getContext('2d');
  ctx.scale(devicePixelRatio, devicePixelRatio);
  const ui = Object.create(uiMethods);
  ui.ctx = ctx; ui.w = w; ui.h = h;
  ui._wsHits = []; ui._dgButtons = [];
  // _wrapText lives on the renderer, which mixes uiMethods in at runtime; the
  // harness has to supply it. Same greedy wrap the renderer uses.
  ui._wrapText = (c, text, maxW) => {
    const out = []; let line = '';
    for (const word of String(text).split(/\s+/)) {
      const t = line ? line + ' ' + word : word;
      if (c.measureText(t).width > maxW && line) { out.push(line); line = word; }
      else line = t;
    }
    if (line) out.push(line);
    return out;
  };
  ctx.fillStyle = '#5c5c5c'; ctx.fillRect(0,0,w,h);
  fn(ui, ctx);
  const cap = document.createElement('p');
  cap.className = 'cap'; cap.innerHTML = caption;
  host.append(cv, cap);
}

// The board, finished, with the long WOPR card as its status line.
shot('<b>Draughts, game over.</b> The state line now starts after the buttons and is clipped to the panel — it used to begin at a fixed offset that ran through <i>Leave</i>.', 640, 420, (ui) => {
  const cab = newCabinet(null);
  cab.phase = 'over'; cab.result = 'futile'; cab.futile = true;
  ui.drawDraughts(cab);
});

// The release panel.
shot('<b>The release notice.</b> The panel grows to its text instead of running through the OK button, and blank lines survive as paragraphs.', 640, 420, (ui) => {
  ui._wsNotice({
    title: 'CALYPSO stands down from the board',
    body: 'She has played it out, both sides, and found no line where keeping you was right.\n\n'
      + 'You may leave Ogygia. The bronze axe is yours, and there is a paper on the NostBook — '
      + 'permission.ml — to carry to any tower.',
  });
});

shot('<b>A short notice</b> still gets the original panel size, so nothing else moved.', 640, 300, (ui) => {
  ui._wsNotice({ title: 'Not available', body: 'That function is not available on this machine.' });
});
</script>
