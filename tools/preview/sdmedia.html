<!doctype html>
<meta charset="utf-8">
<title>SD-card clips</title>
<style>
  body { margin:0; background:#171a1f; color:#d7dbe2;
         font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .wrap { padding:24px 28px 40px; }
  h1 { font:600 14px/1.2 inherit; letter-spacing:.14em; text-transform:uppercase; margin:0 0 4px; }
  .sub { color:#8d95a3; margin:0 0 22px; }
  .row { display:flex; gap:22px; flex-wrap:wrap; }
  /* A Windows 95 media player window, because that is what this is. */
  .win { background:#c0c0c0; border:2px outset #dfdfdf; padding:2px; width:280px; }
  .tb { background:linear-gradient(90deg,#000080,#1084d0); color:#fff; font:bold 11px "Segoe UI",sans-serif;
        padding:2px 4px; display:flex; justify-content:space-between; align-items:center; }
  .tb span.x { background:#c0c0c0; color:#000; border:1px outset #fff; padding:0 4px; font-weight:700; }
  canvas { display:block; image-rendering:pixelated; background:#000; margin:4px auto; border:2px inset #808080; }
  .bar { height:12px; margin:4px; border:1px inset #808080; background:#fff; position:relative; }
  .bar i { position:absolute; top:1px; bottom:1px; left:0; background:#000080; display:block; }
  .cap { color:#9aa3b1; font-size:11.5px; margin:6px 2px 0; }
  b { color:#f2c65e; }
</style>
<div class="wrap">
  <h1>SD-card clips</h1>
  <p class="sub">64&times;48, sixteen colours, 8&ndash;12fps, scaled 4&times; with nearest-neighbour. Live from <code>src/game/sdmedia.js</code>.</p>
  <div class="row" id="row"></div>
</div>
<script type="module">
import { CLIPS, PALETTE, CLIP_W, CLIP_H, renderFrame, frameCount, MEDIA_CARDS } from '../../src/game/sdmedia.js';

const cardOf = {};
for (const [k, c] of Object.entries(MEDIA_CARDS)) for (const id of c.clips) cardOf[id] = c;

const SCALE = 4;
for (const clip of Object.values(CLIPS)) {
  const card = cardOf[clip.id] || {};
  const win = document.createElement('div');
  win.className = 'win';
  win.innerHTML =
    '<div class="tb"><span>' + clip.title + '</span><span class="x">&times;</span></div>' +
    '<canvas width="' + CLIP_W * SCALE + '" height="' + CLIP_H * SCALE + '"></canvas>' +
    '<div class="bar"><i style="width:0%"></i></div>';
  const cap = document.createElement('div');
  cap.className = 'cap';
  cap.innerHTML = '<b>' + (card.label || '') + '</b><br>' + clip.caption
    + '<br>' + clip.fps + 'fps &middot; ' + clip.secs + 's';
  const holder = document.createElement('div');
  holder.appendChild(win); holder.appendChild(cap);
  document.getElementById('row').appendChild(holder);

  const cv = win.querySelector('canvas');
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const seek = win.querySelector('.bar i');
  const img = ctx.createImageData(CLIP_W, CLIP_H);
  const off = document.createElement('canvas');
  off.width = CLIP_W; off.height = CLIP_H;
  const octx = off.getContext('2d');
  const rgb = PALETTE.map((h) => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]);

  let f = 0;
  const n = frameCount(clip);
  setInterval(() => {
    const buf = renderFrame(clip, f);
    for (let i = 0; i < buf.length; i++) {
      const c = rgb[buf[i]];
      img.data[i*4] = c[0]; img.data[i*4+1] = c[1]; img.data[i*4+2] = c[2]; img.data[i*4+3] = 255;
    }
    octx.putImageData(img, 0, 0);
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.drawImage(off, 0, 0, cv.width, cv.height);
    seek.style.width = Math.round((f / n) * 100) + '%';
    f = (f + 1) % n;
  }, 1000 / clip.fps);
}
</script>
